name: oidc-sub-probe
on: [push, workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mint and decode sub
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=oidc-sub-probe"
          req = urllib.request.Request(url)
          req.add_header("Authorization", "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"])
          tok = json.loads(urllib.request.urlopen(req).read())["value"]
          p = tok.split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print("SUB=" + str(c.get("sub")))
          for k in ("repository","repository_id","repository_owner","repository_owner_id","iss","aud","job_workflow_ref"):
              print(k + "=" + str(c.get(k)))
          PY
