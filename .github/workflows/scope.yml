name: c246-scope
on: { workflow_dispatch: {} }
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - env: { JOBTOK: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -u
          echo "JOBTOK length = ${#JOBTOK}"
          curl -s -H "Authorization: token $JOBTOK" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/installation/repositories \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("EXACT total_count =", d.get("total_count")); print("REPOS:", [r["full_name"] for r in d.get("repositories",[])])'
